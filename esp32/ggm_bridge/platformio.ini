# GGM2 mesh host for an ESP32 inside the radio (or on its programming cable). Default board: Seeed XIAO ESP32-C3.
#   pio run -e xiao_c3 -t upload       (USB-C on the XIAO; the radio UART stays on D6/D7)
[platformio]
default_envs = xiao_c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; The portable messenger core lives two folders up (gogu_messenger/messenger); build it into this firmware.
build_src_filter = +<*> +<../../../messenger/msg_packet.c> +<../../../messenger/msg_kiss.c>
	+<../../../messenger/msg_link.c> +<../../../messenger/msg_mesh.c>
build_flags = -I../.. -DGGM_LINK_BAUD=38400

[env:xiao_c3]
board = seeed_xiao_esp32c3
; XIAO D6 = GPIO21 (TX to the radio's RX), D7 = GPIO20 (RX from the radio's TX)
build_flags = ${env.build_flags} -DGGM_LINK_TX=21 -DGGM_LINK_RX=20 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3_supermini]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DGGM_LINK_TX=21 -DGGM_LINK_RX=20 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
