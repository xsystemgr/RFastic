# GGM2 mesh host for an ESP32 inside the radio, on its programming cable, or on the bench.
#   pio run -e xiao_c3 -t upload        XIAO ESP32-C3 wired to the radio's UART
#   pio run -e ttgo -t upload           any TTGO/LilyGO with a classic ESP32, on the K-plug cable
#   pio run -e ttgo_sim -t upload       TTGO bench test, no radio: boards talk over ESP-NOW
[platformio]
default_envs = xiao_c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; The portable messenger core lives three folders up (repo root/messenger); build it into this firmware.
build_src_filter = +<*> +<../../../messenger/msg_packet.c> +<../../../messenger/msg_kiss.c>
	+<../../../messenger/msg_link.c> +<../../../messenger/msg_mesh.c>
build_flags = -I../.. -DGGM_LINK_BAUD=38400

[c3]
; XIAO D6 = GPIO21 (TX to the radio's RX), D7 = GPIO20 (RX from the radio's TX); USB-C is the console
build_flags = ${env.build_flags} -DGGM_LINK_TX=21 -DGGM_LINK_RX=20 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[ttgo]
; Classic ESP32 TTGO/LilyGO boards (T-Display, LoRa32 v2.x, T-Beam): GPIO33 = TX, GPIO32 = RX are free on all
; three. Check your board's pinout if it is another model. The console is the board's USB-UART bridge.
build_flags = ${env.build_flags} -DGGM_LINK_TX=33 -DGGM_LINK_RX=32

[env:xiao_c3]
board = seeed_xiao_esp32c3
build_flags = ${c3.build_flags}

[env:xiao_c3_sim]
board = seeed_xiao_esp32c3
build_flags = ${c3.build_flags} -DGGM_SIM_RADIO=1

[env:c3_supermini]
board = esp32-c3-devkitm-1
build_flags = ${c3.build_flags}

[env:ttgo]
board = esp32dev
build_flags = ${ttgo.build_flags}

[env:ttgo_sim]
board = esp32dev
build_flags = ${ttgo.build_flags} -DGGM_SIM_RADIO=1
